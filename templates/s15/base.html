<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}API 安全{% endblock %} · SMASS</title>
  <style>
    :root { --bg:#f5f7fb; --card:#fff; --ink:#1f2430; --muted:#667085; --line:#e4e7ec;
            --brand:#2456a6; --brand-soft:#e8effb; --ok:#0f7b4f; --ok-soft:#e7f6ef;
            --err:#b42318; --err-soft:#fdecea; --warn:#8a5a00; --warn-soft:#fff4d6; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font:15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px;
             display:flex; gap:12px; align-items:center; justify-content:space-between; }
    .brand { font-weight:700; color:var(--brand); font-size:18px; }
    main { max-width:1050px; margin:0 auto; padding:20px; }
    h1 { font-size:22px; margin:0 0 8px; }
    .lead { color:var(--muted); font-size:14px; margin:0 0 18px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
    .flash.ok { background:var(--ok-soft); color:var(--ok); }
    .flash.error { background:var(--err-soft); color:var(--err); }
    .banner { background:var(--warn-soft); color:var(--warn); padding:10px 14px;
              border-radius:8px; margin-bottom:14px; font-size:13px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; background:#fafbfc; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
    input, select { width:100%; padding:8px 10px; border:1px solid var(--line);
                    border-radius:8px; font:inherit; background:#fff; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
    .row > div { flex:1 1 150px; }
    button, .btn { display:inline-block; padding:8px 14px; border-radius:8px; border:1px solid transparent;
                   background:var(--brand); color:#fff; font:inherit; cursor:pointer; text-decoration:none; font-size:14px; }
    .btn.danger { background:var(--err); }
    .btn.small { padding:5px 9px; font-size:13px; }
    .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px;
           background:var(--brand-soft); color:var(--brand); }
    .tag.ok, .tag.success { background:var(--ok-soft); color:var(--ok); }
    .tag.warn, .tag.429, .tag.pending { background:var(--warn-soft); color:var(--warn); }
    .tag.danger, .tag.401, .tag.403, .tag.409 { background:var(--err-soft); color:var(--err); }
    .muted { color:var(--muted); font-size:13px; }
    .empty { color:var(--muted); padding:18px 4px; }
    .mono { font-family:ui-monospace, Consolas, monospace; font-size:12px; word-break:break-all; }
    .token-box { background:#f2f4f7; border:1px dashed var(--line); border-radius:8px;
                 padding:12px; margin:10px 0; }
    .inline-form { display:inline; }
    @media (max-width:640px) { main { padding:14px; } }
  </style>
</head>
<body>
<header>
  <div class="brand">SMASS API 安全</div>
  <span class="muted">scope · 幂等 · 限流 · 防重放 · 令牌吊销</span>
</header>
<main>
  <div class="banner">示例端点：<span class="mono">GET /s15/api/v1/ping</span>、
    <span class="mono">POST /s15/api/v1/students/count</span>（需 scope 与 Idempotency-Key，另需 X-Timestamp / X-Nonce）。</div>
  {% if ok_message %}<div class="flash ok">{{ ok_message }}</div>{% endif %}
  {% if error_message %}<div class="flash error">{{ error_message }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
