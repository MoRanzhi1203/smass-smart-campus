<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}校内论坛{% endblock %} · SMASS</title>
  <style>
    :root { --bg:#f5f7fb; --card:#fff; --ink:#1f2430; --muted:#667085; --line:#e4e7ec;
            --brand:#2456a6; --brand-soft:#e8effb; --ok:#0f7b4f; --ok-soft:#e7f6ef;
            --err:#b42318; --err-soft:#fdecea; --warn:#8a5a00; --warn-soft:#fff4d6; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font:15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px;
             display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
    .brand { font-weight:700; color:var(--brand); font-size:18px; }
    nav { display:flex; flex-wrap:wrap; gap:6px; }
    nav a { color:var(--muted); text-decoration:none; padding:6px 10px; border-radius:8px; font-size:14px; }
    nav a:hover { background:var(--brand-soft); color:var(--brand); }
    main { max-width:1000px; margin:0 auto; padding:20px; }
    h1 { font-size:22px; margin:0 0 14px; }
    h2 { font-size:17px; margin:22px 0 10px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
    .flash.ok { background:var(--ok-soft); color:var(--ok); }
    .flash.error { background:var(--err-soft); color:var(--err); }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; background:#fafbfc; }
    tr:last-child td { border-bottom:0; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
    input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line);
                              border-radius:8px; font:inherit; background:#fff; }
    textarea { min-height:90px; resize:vertical; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
    .row > div { flex:1 1 150px; }
    button, .btn { display:inline-block; padding:8px 14px; border-radius:8px; border:1px solid transparent;
                   background:var(--brand); color:#fff; font:inherit; cursor:pointer; text-decoration:none; font-size:14px; }
    .btn.ghost { background:#fff; color:var(--brand); border-color:var(--line); }
    .btn.danger { background:var(--err); }
    .btn.muted { background:#eef0f4; color:var(--ink); }
    .btn.small { padding:5px 9px; font-size:13px; }
    .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px;
           background:var(--brand-soft); color:var(--brand); }
    .tag.published, .tag.resolved { background:var(--ok-soft); color:var(--ok); }
    .tag.hidden, .tag.pending, .tag.draft { background:var(--warn-soft); color:var(--warn); }
    .tag.removed, .tag.dismissed { background:var(--err-soft); color:var(--err); }
    .muted { color:var(--muted); font-size:13px; }
    .empty { color:var(--muted); padding:18px 4px; }
    .inline-form { display:inline; }
    .body { white-space:pre-wrap; }
    @media (max-width:640px) { main { padding:14px; } th:nth-child(4), td:nth-child(4) { display:none; } }
  </style>
</head>
<body>
<header>
  <div class="brand">SMASS 校内论坛</div>
  <nav>
    <a href="{% url 'r17:forum' %}">论坛</a>
    <a href="{% url 'r17:announcements' %}">公告</a>
    {% if can_moderate %}<a href="{% url 'r17:reports' %}">举报处理</a>{% endif %}
  </nav>
</header>
<main>
  {% if ok_message %}<div class="flash ok">{{ ok_message }}</div>{% endif %}
  {% if error_message %}<div class="flash error">{{ error_message }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
