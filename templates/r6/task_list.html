{% extends "r10/base.html" %}
{% block title %}R6 待办{% endblock %}
{% block content %}
<div class="sm-page-head"><div><h1 class="sm-title">待办任务（R6）</h1></div></div>
<div class="sm-table-wrap"><table class="sm-table" id="task-table">
<thead><tr><th>实例</th><th>节点</th><th>处理人</th></tr></thead><tbody>
{% for t in tasks %}<tr><td>{{ t.instance_id }}</td><td>{{ t.node.code }}</td><td>{{ t.assignee }}</td></tr>
{% empty %}<tr><td colspan="3">暂无待办</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
