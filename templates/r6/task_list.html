<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>R6 待办</title></head>
<body>{% csrf_token %}<h3>待办任务（R6）</h3>
<table border="1" cellpadding="4" id="task-table">
<thead><tr><th>实例</th><th>节点</th><th>处理人</th></tr></thead><tbody>
{% for t in tasks %}<tr><td>{{ t.instance_id }}</td><td>{{ t.node.code }}</td><td>{{ t.assignee }}</td></tr>
{% empty %}<tr><td colspan="3">暂无待办</td></tr>{% endfor %}
</tbody></table></body></html>
