{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>SMASS - 校园服务与管理系统</title>

    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1-dist/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1-dist/fonts/glyphicons-halflings-regular.woff' %}">
    {% block css %}{% endblock %}

    <style>
        .navbar {
            border-radius: 0;
        }

        .thumbnail:hover{
            background-color: #c0c0c0;
        }

        a:hover {
            text-decoration: none;
        }

        h1 span {
            float: right;
            font-size: 15px;
            position: relative;
            top: 20px; /* 向下移动的距离 */
        }

        img {
            height: 200px;
            width: 100%;
            display: block;
            opacity: 0.6;
        }

        .thumbnail {
            cursor: pointer;
        }

        .caption h3 {
            text-align: center; /* 文字居中 */
            font-size: 40px; /* 字体大小 */
            font-weight: bold; /* 字体粗细 */
            letter-spacing: 4px; /* 汉字间距 */
        }

        /* 未实现模块：不可点击，明确标注 */
        .role-disabled {
            cursor: not-allowed;
            opacity: .45;
            filter: grayscale(100%);
        }

        .role-disabled:hover {
            background-color: transparent;
        }

        .role-badge {
            display: block;
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-default">
    <div class="container-fluid container">
        <div class="page-header">
            <h1>SMASS <small>校园服务与管理系统</small>
                <span>管理员<a href="{% url 'login_admin' %}" class="text-muted">登录</a>入口</span>
            </h1>
        </div>
    </div>
</nav>

<section class="container">
    <div class="row">
        <!-- 学生 -->
        <div class="col-sm-6 col-md-3">
            <div class="thumbnail">
                <a href="{% url 'login_student' %}">
                    <img alt="学生登录" src="{% static 'img/login/student.png' %}">
                    <div class="caption">
                        <h3>学生</h3>
                    </div>
                </a>
            </div>
        </div>

        <!-- 教师 -->
        <div class="col-sm-6 col-md-3">
            <div class="thumbnail">
                <a href="{% url 'login_teacher' %}">
                    <img alt="教师登录" src="{% static 'img/login/teacher.png' %}">
                    <div class="caption">
                        <h3>教师</h3>
                    </div>
                </a>
            </div>
        </div>

        <!-- 宿管：业务尚未实现，隐藏可点击入口并标注 -->
        <div class="col-sm-6 col-md-3">
            <div class="thumbnail role-disabled" title="该模块尚未开放">
                <img alt="宿管（未启用）" src="{% static 'img/login/housemaster.png' %}">
                <div class="caption">
                    <h3>宿管</h3>
                    <span class="role-badge">未启用</span>
                </div>
            </div>
        </div>

        <!-- 商家：业务尚未实现，隐藏可点击入口并标注 -->
        <div class="col-sm-6 col-md-3">
            <div class="thumbnail role-disabled" title="该模块尚未开放">
                <img alt="商家（未启用）" src="{% static 'img/login/business.png' %}">
                <div class="caption">
                    <h3>商家</h3>
                    <span class="role-badge">未启用</span>
                </div>
            </div>
        </div>
    </div>

</section>

<script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
<script src="{% static 'plugins/bootstrap-3.4.1-dist/js/bootstrap.js' %}"></script>
{% block js %}{% endblock %}

</body>
</html>
