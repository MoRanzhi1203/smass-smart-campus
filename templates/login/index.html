{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>Title</title>

    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1-dist/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1-dist/fonts/glyphicons-halflings-regular.woff' %}">
    {% block css %}{% endblock %}

    <style>
        .navbar {
            border-radius: 0;
        }

        .thumbnail:hover{
            background-color: #c0c0c0;
        }

        a:hover {
            text-decoration: none;
        }

        h1 span {
            float: right;
            font-size: 15px;
            position: relative;
            top: 20px; /* 向下移动的距离 */
        }

        img {
            height: 200px;
            width: 100%;
            display: block;
            opacity: 0.6;
        }

        .thumbnail {
            cursor: pointer;
        }

        .caption h3 {
            text-align: center; /* 文字居中 */
            font-size: 40px; /* 字体大小 */
            font-weight: bold; /* 字体粗细 */
            letter-spacing: 4px; /* 汉字间距 */
        }

    </style>
</head>
<body>

<nav class="navbar navbar-default">
    <div class="container-fluid container">
        <div class="page-header">
            <h1>SMASS <small>校园服务与管理系统</small>
                <span>管理员<a href="/admin/admin/list" class="text-muted">登录</a>入口</span>
            </h1>
        </div>
    </div>
</nav>

<section class="container">
    <div class="row">
        <div class="col-sm-6 col-md-3">
            <div class="thumbnail">
                <a href="/student/users/profile/">
                    <img alt="" src="{% static 'img/login/student.png' %}">
                    <div class="caption">
                        <h3>学生</h3>
                    </div>
                </a>
            </div>
        </div>
        <div class="col-sm-6 col-md-3">
            <div class="thumbnail">
                <a href="/teacher/basic/">
                    <img alt="" src="{% static 'img/login/teacher.png' %}">
                    <div class="caption">
                        <h3>教师</h3>
                    </div>
                </a>
            </div>
        </div>
        <div class="col-sm-6 col-md-3">
            <div class="thumbnail">
                <a href="/housemaster/basic/">
                    <img alt="" src="{% static 'img/login/housemaster.png' %}">
                    <div class="caption">
                        <h3>宿管</h3>
                    </div>
                </a>
            </div>
        </div>
        <div class="col-sm-6 col-md-3">
            <div class="thumbnail">
                <a href="/business/basic/">
                    <img alt="" src="{% static 'img/login/business.png' %}">
                    <div class="caption">
                        <h3>商家</h3>
                    </div>
                </a>
            </div>
        </div>
    </div>

</section>

<script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
<script src="{% static 'plugins/bootstrap-3.4.1-dist/js/bootstrap.js' %}"></script>
{% block js %}{% endblock %}

</body>
</html>
