{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>{{ name_ch }}登录 - SMASS</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1-dist/css/bootstrap.css' %}">
    <style>
        .account {
            width: 400px;
            border: 1px solid #dddddd;
            border-radius: 5px;
            box-shadow: 5px 5px 20px #aaa;

            margin-left: auto;
            margin-right: auto;
            margin-top: 100px;
            padding: 20px 40px;
        }

        .account h2 {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="account">
        <h2>{{ name_ch }}账号登录</h2>

        {% if lock_message %}
            <div class="alert alert-warning" role="alert">{{ lock_message }}</div>
        {% endif %}

        <form method="post" action="" novalidate>
            {% csrf_token %}
            {# 保留登录前的目标地址，登录成功后跳回 #}
            <input type="hidden" name="next" value="{{ next|default:'' }}">

            <div class="form-group">
                <label>账号</label>
                {{ form.id }}
                <span style="color: red;">{{ form.id.errors.0 }}</span>
            </div>
            <div class="form-group">
                <label>密码</label>
                {{ form.password }}
                <span style="color: red;">{{ form.password.errors.0 }}</span>
            </div>

            <input type="submit" value="登 录" class="btn btn-primary">

            <a href="{% url 'login' %}" class="btn btn-link">返回</a>
        </form>
    </div>

</body>
</html>
