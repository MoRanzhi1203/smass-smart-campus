<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>SMASS 登录</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f4f6;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.box{background:#fff;padding:28px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.1);width:320px}
h3{margin:0 0 16px}input{width:100%;padding:8px;margin:6px 0 14px;box-sizing:border-box;border:1px solid #d1d5db;border-radius:4px}
button{width:100%;padding:9px;background:#2563eb;color:#fff;border:0;border-radius:4px;cursor:pointer}
.err{background:#fee2e2;color:#991b1b;padding:8px;border-radius:4px;margin-bottom:12px;font-size:13px}
</style></head><body>
<div class="box"><h3>SMASS 登录</h3>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/r21/login/">{% csrf_token %}
<label for="id_login_name">登录名</label><input type="text" name="login_name" id="id_login_name" autofocus>
<label for="id_password">密码</label><input type="password" name="password" id="id_password">
<button type="submit" id="btnLogin">登 录</button>
</form></div></body></html>
