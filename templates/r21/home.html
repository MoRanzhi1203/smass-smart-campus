{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>R2.1 首页</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-5.3.2/css/bootstrap.min.css' %}">
</head>
<body class="bg-light">
<div class="container" style="max-width: 720px; margin-top: 60px;">
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">统一账号首页</h5>

            <table class="table table-sm mt-3">
                <tr><th style="width:140px;">登录名</th><td id="acc-login">{{ account.login_name }}</td></tr>
                <tr><th>显示名</th><td>{{ account.display_name }}</td></tr>
                <tr><th>人员类型</th><td>{{ account.person_type }}</td></tr>
                <tr><th>激活角色</th><td id="acc-roles">{{ roles|join:", " }}</td></tr>
                <tr><th>需强制改密</th><td id="acc-must-change">{{ must_change }}</td></tr>
                <tr><th>授权学院</th><td>{{ account.scope_college|default:"（全局）" }}</td></tr>
            </table>

            <a href="/r21/change-password/" class="btn btn-outline-primary btn-sm">修改密码</a>
            <a href="/r21/logout/" class="btn btn-outline-secondary btn-sm" id="btnLogout">注销</a>
        </div>
    </div>
</div>
</body>
</html>
