{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>R2.1 修改密码</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-5.3.2/css/bootstrap.min.css' %}">
</head>
<body class="bg-light">
<div class="container" style="max-width: 480px; margin-top: 70px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-2">修改密码</h5>

            {% if forced %}
                <div class="alert alert-warning py-2" id="forceNotice">
                    首次登录须先修改密码后才能继续使用系统。
                </div>
            {% endif %}

            {% if done %}
                <div class="alert alert-success py-2" id="doneNotice">密码已更新。</div>
            {% endif %}

            {% if errors %}
                <div class="alert alert-danger py-2" id="errorBox">
                    <ul class="mb-0">
                        {% for e in errors %}<li>{{ e }}</li>{% endfor %}
                    </ul>
                </div>
            {% endif %}

            <form method="post" action="/r21/change-password/">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">当前密码</label>
                    <input type="password" name="current_password" id="id_current" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">新密码</label>
                    <input type="password" name="new_password" id="id_new" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">确认新密码</label>
                    <input type="password" name="confirm_password" id="id_confirm" class="form-control">
                </div>
                <button type="submit" id="btnChange" class="btn btn-primary w-100">保 存</button>
            </form>

            <a href="/r21/home/" class="btn btn-link btn-sm mt-2">返回首页</a>
            <a href="/r21/logout/" class="btn btn-link btn-sm mt-2">注销</a>
        </div>
    </div>
</div>
</body>
</html>
