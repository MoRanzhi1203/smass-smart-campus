<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>R4 组织单元</title></head>
<body>
<h3>组织单元（R4）</h3>
<table border="1" cellpadding="4" id="unit-table">
  <thead><tr><th>编码</th><th>名称</th><th>类型</th><th>上级</th><th>状态</th></tr></thead>
  <tbody>
  {% for unit in units %}
    <tr>
      <td>{{ unit.code }}</td>
      <td>{{ unit.name }}</td>
      <td>{{ unit.unit_type }}</td>
      <td>{% if unit.parent %}{{ unit.parent.code }}{% else %}-{% endif %}</td>
      <td>{{ unit.status }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="5">暂无数据</td></tr>
  {% endfor %}
  </tbody>
</table>
</body>
</html>
