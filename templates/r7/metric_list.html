<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>R7 指标</title></head>
<body>{% csrf_token %}<h3>指标注册表（R7）</h3>
<table border="1" cellpadding="4" id="metric-table">
<thead><tr><th>编码</th><th>名称</th><th>版本</th><th>数据源</th></tr></thead><tbody>
{% for m in metrics %}<tr><td>{{ m.code }}</td><td>{{ m.name }}</td><td>{{ m.version }}</td><td>{{ m.data_source }}</td></tr>
{% empty %}<tr><td colspan="4">暂无指标</td></tr>{% endfor %}
</tbody></table></body></html>
