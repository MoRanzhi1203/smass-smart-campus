{% extends "r10/base.html" %}
{% block title %}R7 指标{% endblock %}
{% block content %}
<div class="sm-page-head"><div><h1 class="sm-title">指标注册表（R7）</h1></div></div>
<div class="sm-table-wrap"><table class="sm-table" id="metric-table">
<thead><tr><th>编码</th><th>名称</th><th>版本</th><th>数据源</th></tr></thead><tbody>
{% for m in metrics %}<tr><td>{{ m.code }}</td><td>{{ m.name }}</td><td>{{ m.version }}</td><td>{{ m.data_source }}</td></tr>
{% empty %}<tr><td colspan="4">暂无指标</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
