<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>R5 教学班</title></head>
<body>{% csrf_token %}
<h3>教学班（R5）</h3>
<table border="1" cellpadding="4" id="section-table">
<thead><tr><th>学期</th><th>课程</th><th>班号</th><th>容量</th><th>状态</th></tr></thead>
<tbody>
{% for s in sections %}
<tr><td>{{ s.term }}</td><td>{{ s.course.title }}</td><td>{{ s.code }}</td><td>{{ s.capacity }}</td><td>{{ s.status }}</td></tr>
{% empty %}<tr><td colspan="5">暂无数据</td></tr>{% endfor %}
</tbody></table>
</body></html>
