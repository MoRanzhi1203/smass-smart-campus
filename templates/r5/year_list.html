{% extends "r10/base.html" %}
{% block title %}R5 学年{% endblock %}
{% block content %}
<div class="sm-page-head"><div><h1 class="sm-title">学年（R5）</h1></div></div>
<div class="sm-table-wrap"><table class="sm-table" id="year-table">
<thead><tr><th>编码</th><th>开始</th><th>结束</th><th>当前</th></tr></thead>
<tbody>
{% for y in years %}
<tr><td>{{ y.code }}</td><td>{{ y.start_date }}</td><td>{{ y.end_date }}</td><td>{{ y.is_active }}</td></tr>
{% empty %}<tr><td colspan="4"><div class="sm-empty"><div class="sm-empty-icon">▤</div><div class="sm-empty-title">暂无数据</div><div class="sm-empty-desc">还没有记录，或当前角色无权查看。</div></div></td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
