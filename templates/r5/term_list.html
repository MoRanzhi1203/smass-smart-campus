{% extends "r10/base.html" %}
{% block title %}R5 学期{% endblock %}
{% block content %}
<div class="sm-page-head"><div><h1 class="sm-title">学期（R5）</h1></div></div>
<div class="sm-table-wrap"><table class="sm-table" id="term-table">
<thead><tr><th>学年</th><th>学期</th><th>开始</th><th>结束</th><th>当前</th></tr></thead>
<tbody>
{% for t in terms %}
<tr><td>{{ t.year.code }}</td><td>{{ t.get_semester_display }}</td><td>{{ t.start_date }}</td><td>{{ t.end_date }}</td><td>{{ t.is_active }}</td></tr>
{% empty %}<tr><td colspan="5"><div class="sm-empty"><div class="sm-empty-icon">▤</div><div class="sm-empty-title">暂无数据</div><div class="sm-empty-desc">还没有记录，或当前角色无权查看。</div></div></td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
