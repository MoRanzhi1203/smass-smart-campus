{% extends "r10/base.html" %}
{% block title %}R5 我的课程{% endblock %}
{% block content %}
<h3>我的课程（R5）</h3>
<table border="1" cellpadding="4" id="my-table">
<thead><tr><th>班号</th><th>课程</th><th>学期</th></tr></thead>
<tbody>
{% for s in sections %}
<tr><td>{{ s.code }}</td><td>{{ s.course }}</td><td>{{ s.term }}</td></tr>
{% empty %}<tr><td colspan="3">暂无修读</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
