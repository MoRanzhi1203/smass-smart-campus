<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>R5 我的课程</title></head>
<body>{% csrf_token %}

<table border="1" cellpadding="4" id="my-table">
<thead><tr><th>班号</th><th>课程</th><th>学期</th></tr></thead>

</tbody></table>
</body></html>
