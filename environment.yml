# SMASS 可复现环境定义
# 创建：conda env create -f environment.yml
# 更新：conda env update -f environment.yml --prune
#
# 版本与 requirements.txt 保持一致（2026-10-27 安全升级后）
name: smass

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  - pip:
      - Django==5.2.17
      - openpyxl==3.1.5
      - Pillow==13.0.0
      - PyMySQL>=1.1.2,<2
